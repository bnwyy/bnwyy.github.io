<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>别闹我有药 - 游戏家族主页</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
            scroll-behavior: smooth;
        }
        body {
            background-color: #0f0f17;
            color: #ffffff;
            line-height: 1.7;
            opacity: 0;
            animation: bodyFade 1s ease forwards;
        }
        @keyframes bodyFade {
            to { opacity: 1; }
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }
        /* ========== 顶部栏｜紫色毛玻璃效果 ========== */
        header {
            background: rgba(123, 44, 191, 0.22);
            backdrop-filter: blur(18px) saturate(150%);
            -webkit-backdrop-filter: blur(18px) saturate(150%);
            border-bottom: 1px solid rgba(157, 78, 221, 0.25);
            padding: 1.2rem 0;
            box-shadow: 0 4px 20px rgba(123, 44, 191, 0.18);
            position: sticky;
            top: 0;
            z-index: 99;
            transition: background 0.35s ease;
        }
        .header-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap:12px;
        }
        .family-name {
            font-size: 1.7rem;
            font-weight:bold;
        }
        .top-link a {
            display:inline-block;
            background:#fff;
            color:#7b2cbf;
            padding:8px 20px;
            border-radius:30px;
            text-decoration:none;
            font-weight:600;
            transition: 0.35s ease;
        }
        .top-link a:hover{
            transform: translateY(-3px);
            box-shadow:0 6px 18px rgba(157,78,221,0.55);
        }
        /* 家族成立计时卡片 */
        .time-card{
            max-width:760px;
            margin:0 auto;
            background:rgba(123,44,191,0.12);
            border:1px solid rgba(157,78,221,0.25);
            border-radius:16px;
            padding:24px;
            text-align:center;
        }
        .time-card-title{
            font-size:1.2rem;
            color:#9d4edd;
            margin-bottom:12px;
        }
        .time-card-value{
            font-size:1.4rem;
            font-weight:bold;
            color:#ffffff;
            font-family:Consolas,monospace;
        }
        /* 板块 滚动动画 */
        .section{
            padding:60px 0;
            opacity:0;
            transform: translateY(40px);
            transition: all 0.75s ease-out;
        }
        .section.active{
            opacity:1;
            transform: translateY(0);
        }
        .sec-title{
            text-align:center;
            font-size:1.6rem;
            color:#9d4edd;
            margin-bottom:36px;
        }
        .sec-title::after{
            content:"";
            display:block;
            width:70px;
            height:3px;
            background:linear-gradient(90deg,#7b2cbf,#9d4edd);
            margin:10px auto 0;
            border-radius:2px;
        }
        /* 家族简介区域 【在这里改简介文字】 */
        .intro-card{
            background:rgba(123,44,191,0.12);
            border:1px solid rgba(157,78,221,0.25);
            border-radius:16px;
            padding:28px;
            text-align:center;
        }
        /* =====家族分布新增样式===== */
        .distribution-card {
            max-width: 760px;
            margin: 0 auto;
            background: rgba(123, 44, 191, 0.12);
            border: 1px solid rgba(157, 78, 221, 0.25);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            transition: 0.35s ease;
        }
        .distribution-card:hover {
            box-shadow: 0 8px 26px rgba(123, 44, 191, 0.32);
        }
        .distribution-btn {
            background: linear-gradient(135deg, #5a96ff, #82c8ff);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            padding: 12px 28px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.35s ease;
            box-shadow: 0 4px 14px rgba(90, 150, 255, 0.25);
        }
        .distribution-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(90, 150, 255, 0.35);
        }
        .distribution-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.45s ease, margin-top 0.45s ease;
        }
        .distribution-content.show {
            max-height: 600px;
            margin-top: 22px;
        }
        .id-text{
            color:#cccccc;
            font-size:1rem;
            background:rgba(255,255,255,0.035);
            border:1px solid rgba(157,78,221,0.2);
            border-radius:12px;
            padding:14px 18px;
            margin-bottom:18px;
        }
        .sub-title-wall {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }
        .sub-title-item {
            padding: 14px 20px;
            border-radius: 16px;
            text-align: center;
            font-size: 1.05rem;
            font-weight: bold;
            transition: 0.35s ease;
            cursor: not-allowed;
            border: 1px solid transparent;
        }
        .sub-title-item:hover {
            transform: translateY(-5px);
        }
        .sub-title-item.gold {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.18), rgba(255, 180, 0, 0.18));
            color: #ffd700;
            border-color: rgba(255, 215, 0, 0.35);
            box-shadow: 0 4px 14px rgba(255, 215, 0, 0.15);
        }
        .sub-title-item.purple {
            background: linear-gradient(135deg, rgba(123, 44, 191, 0.18), rgba(157, 78, 221, 0.18));
            color: #9d4edd;
            border-color: rgba(157, 78, 221, 0.35);
            box-shadow: 0 4px 14px rgba(123, 44, 191, 0.15);
        }
        .sub-title-item.blue {
            background: linear-gradient(135deg, rgba(90, 150, 255, 0.18), rgba(130, 200, 255, 0.18));
            color: #7bb8ff;
            border-color: rgba(90, 150, 255, 0.35);
            box-shadow: 0 4px 14px rgba(90, 150, 255, 0.15);
        }
        /* 成员卡片 */
        .member-box{
            display:flex;
            justify-content:center;
            gap:28px;
            flex-wrap:wrap;
        }
        .member-card{
            width:270px;
            background:rgba(123,44,191,0.16);
            border:1px solid rgba(157,78,221,0.3);
            border-radius:20px;
            padding:32px 22px;
            text-align:center;
            transition:0.4s ease;
        }
        .member-card:hover{
            transform: translateY(-7px);
            box-shadow:0 8px 26px rgba(123,44,191,0.32);
        }
        .role-tag{
            display:inline-block;
            background:linear-gradient(135deg,#7b2cbf,#9d4edd);
            padding:4px 14px;
            border-radius:20px;
            font-size:0.9rem;
            margin-bottom:14px;
        }
        .m-name{
            font-size:1.4rem;
            margin-bottom:18px;
        }
        .qq-btn{
            display:inline-block;
            background:#9d4edd;
            color:#fff;
            text-decoration:none;
            padding:9px 20px;
            border-radius:30px;
            transition:0.35s ease;
        }
        .qq-btn:hover{
            background:#7b2cbf;
            box-shadow:0 4px 14px rgba(123,44,191,0.45);
        }
        /* =====家族称号墙新增样式===== */
        .title-wall {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            max-width: 760px;
            margin: 0 auto;
        }
        .title-item {
            padding: 14px 20px;
            border-radius: 16px;
            text-align: center;
            font-size: 1.05rem;
            font-weight: bold;
            transition: 0.35s ease;
            cursor: not-allowed;
            border: 1px solid transparent;
        }
        .title-item:hover {
            transform: translateY(-5px);
        }
        .title-item.gold {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.18), rgba(255, 180, 0, 0.18));
            color: #ffd700;
            border-color: rgba(255, 215, 0, 0.35);
            box-shadow: 0 4px 14px rgba(255, 215, 0, 0.15);
        }
        .title-item.purple {
            background: linear-gradient(135deg, rgba(123, 44, 191, 0.18), rgba(157, 78, 221, 0.18));
            color: #9d4edd;
            border-color: rgba(157, 78, 221, 0.35);
            box-shadow: 0 4px 14px rgba(123, 44, 191, 0.15);
        }
        .title-item.blue {
            background: linear-gradient(135deg, rgba(90, 150, 255, 0.18), rgba(130, 200, 255, 0.18));
            color: #7bb8ff;
            border-color: rgba(90, 150, 255, 0.35);
            box-shadow: 0 4px 14px rgba(90, 150, 255, 0.15);
        }
        /* 战绩截图板块 */
        .screenshot-card{
            background:rgba(123,44,191,0.12);
            border:1px solid rgba(157,78,221,0.25);
            border-radius:16px;
            padding:24px;
            text-align:center;
            transition:0.35s ease;
        }
        .screenshot-card:hover{
            box-shadow:0 8px 26px rgba(123,44,191,0.32);
        }
        .screenshot-card img{
            width:100%;
            border-radius:12px;
            display:block;
        }
        .screenshot-desc{
            margin-top:14px;
            color:#cccccc;
            font-size:0.95rem;
        }
        footer{
            padding:32px 0;
            text-align:center;
            color:#aaaaaa;
            font-size:0.88rem;
            border-top:1px solid rgba(157,78,221,0.2);
        }
        @media(max-width:700px){
            .family-name{
                font-size:1.3rem;
            }
            .member-card{
                width:100%;
            }
            .title-wall {
                grid-template-columns: 1fr;
            }
            .sub-title-wall{
                grid-template-columns:1fr;
            }
        }
    </style>
</head>
<body>
<!-- 顶部：QQ群链接放在最前面 -->
<header id="mainHeader">

<section class="section">

            <!-- 族长 -->

    </div>

<script>
//家族成立时间：2019‑10‑18 00:00:00
const startDate = new Date('2019-10-18 00:00:00');
const timerDom = document.getElementById('familyTimer');

function getDateDiff(start, now){
    let y = now.getFullYear() - start.getFullYear();
    let m = now.getMonth() - start.getMonth();
    let d = now.getDate() - start.getDate();

    if(d < 0){
        m -= 1;
        const lastMonth = new Date(now.getFullYear(), now.getMonth(), 0);
        d += lastMonth.getDate();
    }
    if(m < 0){
        y -= 1;
        m += 12;
    }

    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    const ss = String(now.getSeconds()).padStart(2,'0');
    return `${y}年${m}月${d}日 ${hh}:${mm}:${ss}`;
}

function updateTimer(){
    const now = new Date();
    timerDom.innerText = getDateDiff(startDate, now);
}
updateTimer();
setInterval(updateTimer,1000);

// 滚动视口动画
const sections = document.querySelectorAll('.section');
const observer = new IntersectionObserver((entries)=>{
    entries.forEach(item=>{
        if(item.isIntersecting){
            item.target.classList.add('active');
        }
    })
},{threshold:0.15});
sections.forEach(s=>observer.observe(s));
// 滚动时毛玻璃加深
const headerDom = document.querySelector('#mainHeader');
window.addEventListener('scroll',()=>{
    if(window.scrollY > 40){
        headerDom.style.background = 'rgba(123, 44, 191, 0.42)';
    }else{
        headerDom.style.background = 'rgba(123, 44, 191, 0.22)';
    }
})
//家族分布折叠展开
function toggleDistribution() {
    const content = document.getElementById('distributionContent');
    content.classList.toggle('show');
}
</script>
</body>
</html>
